services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    ports:
      - '4000:4000'
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000/api
    ports:
      - '5173:80'
    depends_on:
      - api
