:root[data-theme="dark"]{--bg:#1a1013;--card:#26181d;--ink:#f5ecef;--mut:#b9a5ab;--sea:#e2b3c4;--sun:#e2b3c4;--on:#3d0a24;--line:#3a262d;--lg:url(W)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Montserrat",system-ui,sans-serif}
h1,h2,h3{font-family:"Playfair Display",Georgia,system-ui,sans-serif;line-height:1.1;margin:0 0 .5em}
h1{font-size:clamp(2rem,7vw,3.4rem);font-weight:600}h2{font-size:1.6rem}h3{font-size:1.15rem}
a{color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.logo{display:block;width:88px;height:56px;background:var(--lg) center/contain no-repeat;text-decoration:none;font-size:0}
nav{display:flex;gap:4px;overflow-x:auto;flex:1}
nav a{padding:6px 12px;border-radius:99px;text-decoration:none;white-space:nowrap;font-weight:600;font-size:.92rem}
nav a.on{background:var(--ink);color:var(--bg)}
main{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
.hero{background:#3d0a24;color:#fff;border-radius:20px;padding:28px 22px;margin-bottom:24px}
.hero p{color:#ecd6de;max-width:46ch}
.btn{display:inline-block;background:var(--sun);color:var(--on);border:0;border-radius:12px;padding:12px 20px;font:700 1rem "Montserrat",sans-serif;cursor:pointer;text-decoration:none}
.btn.alt{background:transparent;border:2px solid var(--sea);color:var(--sea)}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card .img{overflow:hidden;height:150px;display:grid;place-items:center;font-size:2.4rem;background:var(--c,var(--sea))}
.card .b{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.mut{color:var(--mut);font-size:.9rem}
.tag{font-size:.8rem;font-weight:600;color:var(--sea)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sec{margin:28px 0}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;margin:4px 0 12px}
label{font-weight:600;font-size:.9rem}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:560px}
.steps{display:flex;gap:6px;margin-bottom:16px}.steps span{flex:1;height:5px;border-radius:9px;background:var(--line)}.steps .d{background:var(--sea)}
.ok{background:var(--sea);color:#fff;border-radius:14px;padding:22px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:8px}summary{font-weight:600;cursor:pointer}
.hero-detail{height:220px;border-radius:16px;overflow:hidden;margin-bottom:16px;background:var(--line)}
.card .img svg,.card .img img,.hero-detail svg,.hero-detail img,.ph svg{display:block;width:100%;height:100%;object-fit:cover}.card .img.sq{height:auto;aspect-ratio:4/5}.banner{border-radius:16px;overflow:hidden;margin-bottom:12px}.banner img{width:100%;display:block}.ph{border-radius:14px;overflow:hidden;height:170px;margin-bottom:16px}
#dd{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 16px 16px;padding:8px;max-height:calc(100vh - 90px);overflow-y:auto;box-shadow:0 12px 30px rgba(0,0,0,.18)}
@media(min-width:700px){#dd{left:auto;right:16px;width:340px}}
#dd a,#dd summary{display:block;padding:12px 14px;border-radius:10px;text-decoration:none;font-weight:600;cursor:pointer}
#dd summary::after{content:"▾";float:right}#dd details[open] summary::after{content:"▴"}
#dd details{background:none;border:0;padding:0;margin:0}#dd details a{padding-left:30px;font-weight:400}
#dd a:hover,#dd summary:hover{background:var(--line)}#dd a.on{background:var(--sun);color:var(--on)}
.cb{margin-left:auto;text-decoration:none;font-weight:600;padding:8px 12px}
.mb{background:var(--sun);color:var(--on);border:0;border-radius:99px;padding:8px 16px;font:700 1.3rem/1 "Montserrat",sans-serif;cursor:pointer}
.how{margin:20px 0}.how ol{list-style:none;counter-reset:s;padding:0;display:grid;gap:10px;margin:0 0 10px}.how li{counter-increment:s;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 54px;position:relative}.how li::before{content:counter(s);position:absolute;left:14px;top:10px;width:28px;height:28px;border-radius:50%;background:var(--sun);color:var(--on);display:grid;place-items:center;font-weight:700}
.pc{position:relative;display:block;border-radius:16px;overflow:hidden;min-height:270px;color:#fff;text-decoration:none;background:#3d0a24}
.pc>img,.pc>svg,.bg>img,.bg>svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pc::after,.heroph::after,.hd::after,.bn::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(38,4,22,.95) 0%,rgba(38,4,22,.6) 42%,rgba(38,4,22,.05) 100%)}
.pc .tx{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:16px;display:flex;flex-direction:column;gap:3px}
.pc h3{margin:0;color:#fff;font-size:1.3rem}.pc .tx span{font-size:.9rem;color:#f0e0e6}.pc .tx .tg{font-weight:600;color:#f0c7d5}.pc .tx b{margin-top:4px}
.heroph{position:relative;overflow:hidden;padding:0;min-height:440px;display:flex;align-items:flex-end}.heroph .bg{position:absolute;inset:0}.heroph .in{position:relative;z-index:1;padding:24px 22px}
.hd{position:relative;height:280px}.hd .ov,.bn .ov{position:absolute;left:18px;right:18px;bottom:16px;z-index:1;color:#fff}
.hd .ov h1,.bn .ov h2,.bn .ov h3{margin:0 0 4px;color:#fff}.hd .tag{color:#f0c7d5}.bn{position:relative}.bn img{min-height:260px;object-fit:cover}.bn .ov p{margin:0;color:#f0e0e6}
footer{text-align:center;color:var(--mut);padding:24px 16px;font-size:.9rem;border-top:1px solid var(--line)}
</style></head><body>
