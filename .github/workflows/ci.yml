name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/neneen
      DIRECT_URL: postgresql://user:password@localhost:5432/neneen
      JWT_SECRET: ci-only-dummy-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run format:check
      - run: npx prettier --check .github/workflows/ci.yml docker-compose.yml docker-compose.test.yml tests/deployment/smoke.mjs scripts/build-vercel.mjs vercel.json render.yaml docs/DEPLOYMENT.md
      - name: Validate GitHub Actions workflow
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - run: npm test
      - run: npm run build
      - name: Build Vercel output
        run: node scripts/build-vercel.mjs
        env:
          RENDER_API_ORIGIN: https://api-ci.example.com
  containers:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BACKEND_ENV_FILE: tests/deployment/backend.env
      WEB_PORT: '15173'
      COMPOSE_PROJECT_NAME: neneen-ci
      COMPOSE_FILE: docker-compose.yml:docker-compose.test.yml
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: docker compose config --quiet
      - run: docker compose build --pull
      - run: docker compose up -d --wait --wait-timeout 120
      - run: node tests/deployment/smoke.mjs
      - name: Verify migrations are repeatable
        run: docker compose run --rm migrate
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color --tail=150
      - name: Cleanup isolated test stack
        if: always()
        run: docker compose down --volumes --remove-orphans
